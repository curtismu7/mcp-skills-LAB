# OrbStack:  docker compose up --build -d   ->  http://127.0.0.1:7807   (MCP endpoint: POST /mcp, health: GET /api/health)
# The server binds 0.0.0.0 INSIDE the container (SKILLS_LAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7800-7999 (this app's port is 7807).
# Mock mode needs nothing else: the lab is self-contained and makes no outbound call at all.
#
# Real mode: mount a folder of skill folders READ-ONLY and point SKILLS_DIR at it, then recreate the container:
#   volumes:
#     - /path/to/your/skills:/skills:ro
#   environment:
#     SKILLS_DIR: /skills
name: mcp-skills-lab

services:
  mcp-skills-lab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-7807}:7807"
    environment:
      PORT: "7807"
      SKILLS_LAB_BIND: 0.0.0.0
      SHELF_URL: ${SHELF_URL:-}
      # The shared lab-proxy reaches this lab as this Host name (see AI-DEMO-Standalone shared/lab-proxy); loopback always works.
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-mcp-skills-lab.local.ping-devops.com}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7807/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
